version: '3.6'

services:
  api:
    image: image-name
    deploy:
      replicas: 1
      update_config:
        parallelism: 1 # Número de tareas que se actualizan en paralelo.
        delay: 10s # Tiempo de espera entre actualizaciones de tareas.
        failure_action: rollback # Acción a tomar en caso de fallo de actualización. Puede ser pause, continue o rollback. rollback es la opción que revertirá los cambios en caso de falla
        monitor: 10s #Tiempo durante el cual Docker monitorea cada tarea después de la actualización para asegurarse de que esté funcionando correctamente
        max_failure_ratio: 0.1 # Proporción máxima de fallos tolerables durante la actualización antes de que se considere una falla
      rollback_config:
        parallelism: 1
        delay: 10s
      resources:
        limits: # Define el máximo de recursos que un contenedor puede usar. Si el contenedor intenta usar más recursos de los definidos aquí, Docker limitará su uso.
          cpus: '0.5'  # Limitar a 0.5 cores
          memory: 300M # Limitar a 512MB de RAM
        reservations: # Define la cantidad mínima de recursos que Docker intentará garantizar para este contenedor. Si no hay suficientes recursos disponibles, Docker Swarm no programará el contenedor
          cpus: '0.25'       # Reservar 0.25 cores
          memory: 256M       # Reservar 256MB de RAM
    env_file:
      - env-file
    environment:
      - MONGO_DB_NAME=db_name
      - MONGO_DB_HOST=db_host
      - MONGO_DB_PORT=db_port
      - MONGO_DB_USER=db_user
      - MONGO_DB_PWD=db_password
      - MONGO_USE_PASSWORD="true"
      - APP_SECURITY_PRIVATE_KEY=private_key
      - APP_SECURITY_PUBLIC_KEY=public_key
    volumes: 
      - app-volume:/app/public
      - app-logs:/app/logs
    ports:
      - port-in:port-out

volumes:
  "app-volume":
    external: true
  "app-logs":
    external: true

networks:
  default: 
    external: true
    name: app-network